name: Build

# Every push to main, every pull request, and every tag. A push to main publishes a development
# prerelease; a v* tag publishes a release. Windows and Linux packages come from here. macOS is
# built and tested here as a check, but its disk image is signed, notarised and attached by hand
# with tools/release.sh: the Developer ID and notary key stay on the machine that owns them.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A second push while the first is still building makes the first pointless. Tags are exempt:
# cancelling one would cancel a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-26
            preset: universal
          - name: Linux
            os: ubuntu-24.04
            preset: release
          - name: Windows
            os: windows-2022
            preset: release

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---- Toolchain -----------------------------------------------------------------------------

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        # JUCE's list for a GUI plugin, less webkit and curl, which this plugin turns off. xvfb is
        # for the VST3 and LV2 manifest helpers, which load the freshly built plugin and want a
        # display to do it on.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache xvfb \
            libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Activate MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compiler cache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-

      # ---- Build ---------------------------------------------------------------------------------

      - name: Configure
        run: |
          LAUNCHER=""
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            LAUNCHER="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          cmake --preset ${{ matrix.preset }} -DTSPLUG_COPY_AFTER_BUILD=OFF $LAUNCHER

      - name: Build
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a cmake --build --preset ${{ matrix.preset }}
          else
            cmake --build --preset ${{ matrix.preset }}
          fi

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # ---- Package -------------------------------------------------------------------------------

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tools/package.sh linux

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: tools/package.sh windows

      - name: Upload
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: TabulaSonora-Plugin-${{ runner.os }}
          path: |
            build/release-out/*.zip
            build/release-out/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Name the build
        id: name
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Every push to main is a release of its own, a prerelease that never becomes "latest".
      - name: Publish a development build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: main-${{ steps.name.outputs.short }}
          name: Development build ${{ steps.name.outputs.short }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: artifacts/*
          body: |
            An automatic build of `main` at ${{ steps.name.outputs.short }}. Unreleased work, not a
            version: for a stable build use the newest release without this notice.

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            The Roland Sound Canvas VA voice as VST3, Audio Unit, CLAP and LV2, plus a standalone
            app. Windows and Linux builds are attached here, unsigned. The macOS disk image
            (universal, signed and notarised) is attached separately.

            You need your own `SCCore.dll` from a licensed SOUND Canvas VA installation. Nothing
            Roland-derived is included. The plugin asks for the file once and remembers it.

      - name: Keep the ten newest development builds
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("main-")))]
                  | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
          | while read -r tag; do
              echo "Removing $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
