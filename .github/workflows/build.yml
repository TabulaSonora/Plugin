name: Build

# Every push to main, every pull request, and every tag. A push to main publishes a development
# prerelease; a v* tag publishes a release. The macOS build is signed and notarised when the
# repository carries the certificate and notary key, and packaged ad-hoc signed when it does not,
# so a fork's pull request still proves the packaging.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A second push while the first is still building makes the first pointless. Tags are exempt:
# cancelling one would cancel a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-26
            preset: universal
          - name: Linux
            os: ubuntu-24.04
            preset: release
          - name: Windows
            os: windows-2022
            preset: release

    # Job-level, because `if: env.X != ''` is the only way a step can ask whether a secret
    # exists; a fork's pull request gets every one of these as an empty string.
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---- Toolchain -----------------------------------------------------------------------------

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        # JUCE's list for a GUI plugin, less webkit and curl, which this plugin turns off. xvfb is
        # for the VST3 and LV2 manifest helpers, which load the freshly built plugin and want a
        # display to do it on.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache xvfb \
            libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Activate MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compiler cache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-

      # ---- Build ---------------------------------------------------------------------------------

      - name: Configure
        run: |
          LAUNCHER=""
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            LAUNCHER="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          cmake --preset ${{ matrix.preset }} -DTSPLUG_COPY_AFTER_BUILD=OFF $LAUNCHER

      - name: Build
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a cmake --build --preset ${{ matrix.preset }}
          else
            cmake --build --preset ${{ matrix.preset }}
          fi

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # ---- Package -------------------------------------------------------------------------------

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tools/package.sh linux

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: tools/package.sh windows

      # The certificate, into a keychain that exists for this job and no longer. Not the login
      # keychain, which on a GitHub runner is unlocked with a known password. `-T codesign` lets
      # codesign use the key, `set-key-partition-list` stops macOS asking permission the first time
      # it does, `list-keychains -s` puts the keychain where codesign looks, and the long timeout
      # keeps it unlocked past a cold build. The identity is read back out rather than kept as a
      # sixth secret.
      - name: Import the signing certificate
        id: signing
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/tsplug-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          P12="$RUNNER_TEMP/certificate.p12"
          trap 'rm -f "$P12"' EXIT

          # The two ways the secrets arrive half-made, named before `security` gets to say
          # "Unable to decode the provided data" about either of them.
          if [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
              echo "::error::MACOS_CERTIFICATE_P12 is set but MACOS_CERTIFICATE_PASSWORD is empty. Both are needed; set the password the .p12 was exported with."
              exit 1
          fi
          if ! printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$P12" 2>/dev/null \
             || ! openssl pkcs12 -in "$P12" -passin "pass:$MACOS_CERTIFICATE_PASSWORD" -noout -legacy 2>/dev/null \
             && ! openssl pkcs12 -in "$P12" -passin "pass:$MACOS_CERTIFICATE_PASSWORD" -noout 2>/dev/null; then
              echo "::error::MACOS_CERTIFICATE_P12 does not decode to a PKCS#12 file that opens with MACOS_CERTIFICATE_PASSWORD. Set it to the output of: base64 -i DeveloperID.p12 | pbcopy"
              exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # A .p12 holding a certificate and no private key imports without complaint and cannot
          # sign. An identity is both, so count identities and say so in English.
          IDENTITIES=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" || true)
          COUNT=$(printf '%s' "$IDENTITIES" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
              echo "::error::expected exactly one Developer ID Application identity in MACOS_CERTIFICATE_P12, found $COUNT. Export it from Keychain Access's My Certificates category (certificate and key together)."
              exit 1
          fi
          IDENTITY=$(printf '%s' "$IDENTITIES" | sed -E 's/.*"(.*)".*/\1/')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
          echo "Signing as $IDENTITY"

      - name: Note that this run will not be signed
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 == ''
        run: echo "::warning::no MACOS_CERTIFICATE_P12 secret; packaging an ad-hoc signed disk image that Gatekeeper will refuse."

      # Notarisation on main and on tags only: it uploads to Apple and waits on a service this
      # project does not control, and it answers a question -- will Gatekeeper open this -- that
      # only matters for an image somebody is going to download. A pull request producing a signed
      # but unnotarised image is the right amount of proof that signing works.
      #
      # The .p8 is written to a file, the only form notarytool accepts, and removed by a trap. The
      # secret may be the key's own text or base64 of it; the PEM header tells the two apart.
      - name: Sign, notarise and package (macOS)
        if: runner.os == 'macOS'
        env:
          TSPLUG_SIGN_IDENTITY: ${{ steps.signing.outputs.identity || '-' }}
          TSPLUG_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          TSPLUG_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          NOTARISE_HERE: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && steps.signing.outputs.identity != '' && env.MACOS_NOTARY_KEY_P8 != '' }}
        run: |
          if [[ "$NOTARISE_HERE" == "true" ]]; then
            export TSPLUG_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
            trap 'rm -f "$TSPLUG_NOTARY_KEY"' EXIT
            case "$MACOS_NOTARY_KEY_P8" in
              *"-----BEGIN"*) printf '%s' "$MACOS_NOTARY_KEY_P8" > "$TSPLUG_NOTARY_KEY" ;;
              *) printf '%s' "$MACOS_NOTARY_KEY_P8" | base64 --decode > "$TSPLUG_NOTARY_KEY" ;;
            esac
            if ! grep -q -- "-----BEGIN PRIVATE KEY-----" "$TSPLUG_NOTARY_KEY"; then
              echo "::error::MACOS_NOTARY_KEY_P8 is not an App Store Connect private key (expected the .p8 text or its base64)."
              exit 1
            fi
          else
            export TSPLUG_SKIP_NOTARISE=1
          fi
          tools/release.sh

      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}" || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TabulaSonora-Plugin-${{ runner.os }}
          path: |
            build/release-out/*.dmg
            build/release-out/*.zip
            build/release-out/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Name the build
        id: name
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Every push to main is a release of its own, a prerelease that never becomes "latest".
      - name: Publish a development build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: main-${{ steps.name.outputs.short }}
          name: Development build ${{ steps.name.outputs.short }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: artifacts/*
          body: |
            An automatic build of `main` at ${{ steps.name.outputs.short }}. Unreleased work, not a
            version: for a stable build use the newest release without this notice.

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            The Roland Sound Canvas VA voice as VST3, Audio Unit, CLAP and LV2, plus a standalone
            app. macOS builds are universal, signed and notarised; Windows and Linux builds are
            unsigned.

            You need your own `SCCore.dll` from a licensed SOUND Canvas VA installation. Nothing
            Roland-derived is included. The plugin asks for the file once and remembers it.

      - name: Keep the ten newest development builds
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("main-")))]
                  | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
          | while read -r tag; do
              echo "Removing $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
